[project]
name = "cut-and-caption-engine"
version = "0.1.0"
description = "Cut & Caption engine: silence cuts, word-level captions, zooms (media processing, no UI)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "av>=14",                      # probing (FFmpeg libraries as a wheel — no ffprobe needed)
    "imageio-ffmpeg>=0.6",         # a complete static ffmpeg in a wheel, same on every OS
    "nodejs-wheel>=22",            # Node.js + npm for the editor, no system install
    "huggingface_hub>=0.24",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv]
package = false   # dependencies only; run.py imports the engine from source
